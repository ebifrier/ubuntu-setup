# ~/.tmux.conf
# GNU screen (escape ^Oo) の操作感に寄せた設定

# --- プレフィックス -------------------------------------------------
# screen の `escape ^Oo` 相当。
# コマンド文字を C-o に、リテラル文字を o にする。
unbind C-b
set -g prefix C-o

# C-o o で本物の C-o がシェルに届く（readline の operate-and-get-next 等）
bind o send-prefix

# screen ではエスケープ文字の2連打で直前のウィンドウに戻る。
# tmux のデフォルト（rotate-window）を上書きする。
bind C-o last-window


# --- ペイン（screen の region）--------------------------------------
# 分割。screen と同じキーに合わせる（S = 上下、| = 左右）。
bind S split-window -v
bind | split-window -h

# BTab が効かない端末向けの代替（必要なら有効化）
# bind O select-pane -p


# --- ウィンドウ ------------------------------------------------------
# n / p は tmux のデフォルトのままで screen と一致するので指定不要。
bind Space  next-window
bind BSpace previous-window

# screen: " = ウィンドウ一覧, A = 名前変更, k = 閉じる
# 注意: " を上書きするので、縦分割は上の | に移してある。
bind '"' choose-window
bind A   command-prompt -I "#W" "rename-window '%%'"
bind k   confirm-before -p "kill-window #W? (y/n)" kill-window

# --- クリップボードを無効化(claude code利用時の対応) ---------------
set -g set-clipboard on
set -ga terminal-features ',*:clipboard'
set -g allow-passthrough on

